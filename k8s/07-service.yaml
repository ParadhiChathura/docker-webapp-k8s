# Stable DB name the app uses: jdbc:mysql://devopsdb:3306/accounts
apiVersion: v1
kind: Service
metadata:
  name: devopsdb
  namespace: vprofile
spec:
  type: ClusterIP
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
---
# Headless service that gives the StatefulSet pod its stable DNS (mysql-0.mysql-headless)
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: vprofile
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306}
---
# App service - access through NodePort 30080; no application Load Balancer
apiVersion: v1
kind: Service
metadata:
  name: vprofile-app
  namespace: vprofile
  labels: {app: vprofile-app}
spec:
  type: NodePort
  selector: {app: vprofile-app}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
