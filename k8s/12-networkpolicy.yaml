# Enforced by Calico. Deny all incoming traffic, then open only what's needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vprofile
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# App: allow incoming HTTP traffic on port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-http
  namespace: vprofile
spec:
  podSelector:
    matchLabels: {app: vprofile-app}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
---
# MySQL: only the app pods may connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-app
  namespace: vprofile
spec:
  podSelector:
    matchLabels: {app: mysql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: vprofile-app}
      ports:
        - {protocol: TCP, port: 3306}
---
# RabbitMQ: allow connections only from VProfile application pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-allow-app
  namespace: vprofile
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vprofile-app
      ports:
        - protocol: TCP
          port: 5672
